name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Prepare vector index from fixture corpus
        run: |
          mkdir -p data/processed
          cp tests/fixtures/chunks.jsonl data/processed/chunks.jsonl
          python -m src.ingest.run --rebuild

      - name: Run unit tests (no live Groq)
        run: pytest -m "not integration" --tb=short -q
